[project]
name = "cocourdu"
version = "2.0.0a0"
description = "COCO-Urdu v2: translation, multimodal QE, human study, and retrieval baselines for Urdu image captions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.13",
  "tqdm>=4.66",
  "pyyaml>=6",
  "requests>=2.32",
  "huggingface_hub>=0.26",
  "datasets>=3.0",
  "sacrebleu>=2.4",
  "Pillow>=10",
]

[project.optional-dependencies]
rating = ["streamlit>=1.38"]
api = ["openai>=1.50"]
# heavy ML deps; install only where needed (Mac or Colab)
ml = [
  "torch>=2.4",
  "transformers>=4.49",
  "accelerate>=1.0",
  "sentencepiece>=0.2",
  "protobuf>=4",
]
qe = [
  "cocourdu[ml]",
  "unbabel-comet>=2.2",
  "bert-score>=0.3.13",
]
analysis = ["matplotlib>=3.9", "seaborn>=0.13", "statsmodels>=0.14"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cocourdu"]
